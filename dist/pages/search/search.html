<header class="search-header">
  <button class="icon-button search-back" aria-label="返回首页">
    <img src="assets/search-img11.svg" alt="" />
  </button>
  <form class="search-form" role="search">
    <input
      type="search"
      value="夏季穿搭"
      aria-label="搜索内容"
      autocomplete="off"
      enterkeyhint="search"
    /><button type="button" class="search-clear" aria-label="清空搜索">
      <img src="assets/search-imgGroup139.svg" alt="" /></button

      src="assets/search-imgVector207.svg"
      class="search-divider"
      alt=""

<nav class="search-tabs" aria-label="搜索分类">

      ><img src="assets/search-imgScreenshot20260708At12412.png" alt="" /></span

</nav>
<section class="search-feed scroll-region" aria-label="搜索结果">
  <div class="masonry">
    <div class="masonry-column"></div>
    <div class="masonry-column"></div>
  </div>
  <div class="feed-sentinel" aria-hidden="true"></div>
</section>
